# Defaults match the docker-compose stack in the ddd-demo repo (docker compose up -d).
spring:
  application:
    name: sample-service

  datasource:
    # One PostgreSQL instance for everyone, but one schema per service:
    # currentSchema puts this service's tables in "sample_service" only.
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:ddd_demo}?currentSchema=sample_service
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:1q2w3e4r!@}

  flyway:
    schemas: sample_service
    default-schema: sample_service

  jpa:
    hibernate:
      # Flyway owns the schema. "validate" would be better, but the outbox library's own table uses
      # SMALLINT columns that its entity maps as Integer, so validation fails at startup.
      # The library and the Outbox-Service use "none" as well.
      ddl-auto: none
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer   # payloads are bytes
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer   # the consumer library reads bytes
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8080   # kafka-ui uses 8090 on the host, so 8080 stays free

sample:
  topics:
    # Naming follows the Microservice Dungeon pattern bl.<entity>.events.v<n> ("bl" = business events).
    # Whether our course adopts this convention is still open (ADR).
    reservation-events: bl.reservation.events.v1
    partitions: 3
  local-relay:
    # Stand-in for the Outbox-Service. Off by default; switch on with the "local-relay" profile
    # when no Outbox-Service container reads this service's outbox. Never both at once.
    enabled: false
    interval-ms: 500

# Outbox library: every topic this service writes to. The library checks at startup that each
# one exists in Kafka and reads its partition count.
outbox:
  topics:
    - name: ${sample.topics.reservation-events}
